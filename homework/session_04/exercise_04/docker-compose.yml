services:
  nginx_proxy:
    image: nginx:alpine
    container_name: storex-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user_service
      - product_service
    networks:
      - storex-net
    restart: on-failure

  user_service:
    image: storex-user:latest
    container_name: storex-user
    expose:
      - "8081"        
    environment:
      - SERVER_PORT=8081
    networks:
      - storex-net

  product_service:
    image: storex-product:latest
    container_name: storex-product
    expose:
      - "8082"
    environment:
      - SERVER_PORT=8082
    networks:
      - storex-net

networks:
  storex-net:
    name: storex-net
