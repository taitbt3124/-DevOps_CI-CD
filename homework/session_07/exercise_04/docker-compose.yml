version: "3.8"

services:
  runner:
    image: myoung34/github-runner:latest
    container_name: restaurant-runner
    restart: always
    environment:
      REPO_URL: https://github.com/<github-username>/restaurant-service
      ACCESS_TOKEN: ${RUNNER_TOKEN}
      RUNNER_NAME: restaurant-runner
      RUNNER_SCOPE: repo
      LABELS: quickbite-restaurant
      RUNNER_WORKDIR: /tmp/runner/work
    security_opt:
      - label:disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/runner/work:/tmp/runner/work
